<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:auto}

<p class="m">Az adatok a Kraken publikus API-jából jönnek. Valószínűségi értékelés, nem pénzügyi tanács.</p>
<script>
const $=s=>document.querySelector(s);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const TF=[[15,'15p',.1,1],[60,'1ó',.3,2],[240,'4ó',.4,3],[1440,'1n',.2,3]];
const S={};
const fmt=n=>Math.round(n).toLocaleString('hu-HU');
function ema(a,n){const k=2/(n+1);let e=a[0];return a.map((v,i)=>i?(e=v*k+e*(1-k)):e)}
function rsi(c,n=14){const r=Array(c.length).fill(null);if(c.length<=n)return r;let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;r[n]=100-100/(1+g/(l||1e-9));for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;r[i]=100-100/(1+g/(l||1e-9))}return r}
function stoch(r,n=14){return r.map((v,i)=>{if(v==null||i<2*n-1)return null;const w=r.slice(i-n+1,i+1);if(w.some(x=>x==null))return null;const lo=Math.min(...w),hi=Math.max(...w);return hi==lo?50:(v-lo)/(hi-lo)*100})}
const smooth=(a,n)=>a.map((v,i)=>{if(v==null||i<n-1)return null;const w=a.slice(i-n+1,i+1);return w.every(x=>x!=null)?w.reduce((p,q)=>p+q)/n:null});
function piv(x,k,hi){const o=[];for(let i=k;i<x.length-k;i++){let ok=true;for(let j=1;j<=k;j++){if(hi?(x[i].h<=x[i-j].h||x[i].h<=x[i+j].h):(x[i].l>=x[i-j].l||x[i].l>=x[i+j].l)){ok=false;break}}if(ok)o.push(i)}return o}
function div(cd,R,A){const n=cd.length,o=[];
const ph=piv(cd,3,1).filter(i=>i>n-90),pl=piv(cd,3,0).filter(i=>i>n-90);
if(ph.length>=2){const a=ph.at(-2),b=ph.at(-1);
if(n-b<=25&&b-a>=5&&cd[b].h-cd[a].h>=.5*A&&R[a]!=null&&R[a]-R[b]>=3){const lo=Math.min(...cd.slice(a,b+1).map(q=>q.l));o.push({t:'bearish',ok:cd.slice(b+1).some(q=>q.c<lo)})}}
if(pl.length>=2){const a=pl.at(-2),b=pl.at(-1);
if(n-b<=25&&b-a>=5&&cd[a].l-cd[b].l>=.5*A&&R[a]!=null&&R[b]-R[a]>=3){const hi=Math.max(...cd.slice(a,b+1).map(q=>q.h));o.push({t:'bullish',ok:cd.slice(b+1).some(q=>q.c>hi)})}}
return o}
function fvg(cd){const o=[];for(let i=2;i<cd.length;i++){const a=cd[i-2],c=cd[i];let g=null;
if(c.l>a.h)g={t:'bull',lo:a.h,hi:c.l};else if(c.h<a.l)g={t:'bear',lo:c.h,hi:a.l};
if(!g||(g.hi-g.lo)/g.lo<.0005)continue;
let f=false;for(let j=i+1;j<cd.length;j++){if(g.t=='bull'?cd[j].l<=g.lo:cd[j].h>=g.hi){f=true;break}}
if(!f)o.push(g)}return o}
function struct(cd){const ph=piv(cd,3,1),pl=piv(cd,3,0);if(ph.length<2||pl.length<2)return{t:'nincs elég adat'};
const h1=cd[ph.at(-2)].h,h2=cd[ph.at(-1)].h,l1=cd[pl.at(-2)].l,l2=cd[pl.at(-1)].l,H=h2>h1?'HH':'LH',L=l2>l1?'HL':'LL';
return{H,L,h1,h2,l1,l2,t:H=='HH'&&L=='HL'?'emelkedő':H=='LH'&&L=='LL'?'csökkenő':'vegyes'}}
function analyze(raw){const cd=raw.slice(0,-1),c=cd.map(x=>x.c),n=c.length-1;
const e20=ema(c,20),e50=ema(c,50),e200=ema(c,200),R=rsi(c),K=smooth(stoch(R),3),D=smooth(K,3);
const m=ema(c,12).map((v,i)=>v-ema(c,26)[i]),sg=ema(m,9),h=m[n]-sg[n],hp=m[n-1]-sg[n-1];
const vv=cd.map(x=>x.v),va=vv.slice(-21,-1).reduce((p,q)=>p+q)/20,p=c[n];
const A=atr(cd);const stt=struct(cd).t;let s=(stt=='emelkedő'?1:stt=='csökkenő'?-1:0)+(p>e50[n]&&e50[n]>e200[n]?1:p<e50[n]&&e50[n]<e200[n]?-1:0)+(h>0?1:-1);
return{p,e20:e20[n],e50:e50[n],e200:e200[n],rsi:R[n],k:K[n],d:D[n],h,hp,vr:vv[n]/va,s,atr:A,div:div(cd,R,A),fvg:fvg(cd),st:struct(cd),cd}}
function zones(tf,p){const pts=[];tf.slice(1).forEach(t=>[1,0].forEach(hi=>piv(t.cd,4,hi).forEach(i=>{const v=hi?t.cd[i].h:t.cd[i].l;if(Math.abs(v-p)/p<.15)pts.push([v,t.zw])})));
pts.sort((a,b)=>a[0]-b[0]);const z=[];pts.forEach(([v,w])=>{const g=z.at(-1);if(g&&v<=g.lo*1.006){g.hi=v;g.s+=w;g.n++}else z.push({lo:v,hi:v,s:w,n:1})});
return z.filter(g=>g.n>=2).map(g=>({...g,mid:(g.lo+g.hi)/2}))}
async function tick(){const r=await fetch('https://api.kraken.com/0/public/Ticker?pair=XBTUSD');const j=await r.json();return +j.result[Object.keys(j.result)[0]].c[0]}
async function get(iv){const r=await fetch('https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval='+iv);const j=await r.json();
if(j.error&&j.error.length)throw new Error(j.error.join());const k=Object.keys(j.result).find(x=>x!='last');
return j.result[k].map(a=>({t:a[0],o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[6]}))}
const lab=o=>o>=60?['Erősen emelkedő','up']:o>=20?['Emelkedő','up']:o>-20?['Semleges','nu']:o>-60?['Csökkenő','dn']:['Erősen csökkenő','dn'];
const row=(a,b)=>`<div class="r"><span>${a}</span><b>${b}</b></div>`;
const near=(a,p)=>a.slice().sort((x,y)=>Math.abs((x.lo+x.hi)/2-p)-Math.abs((y.lo+y.hi)/2-p)).slice(0,2);
function card(t){const p=S.price,[l,c]=lab(t.s*100/3);
const ab=(v)=>p>v?'felett':'alatt';
const sk=t.k==null?'–':`K ${t.k.toFixed(0)} / D ${t.d.toFixed(0)}${t.k>80?' (túlvett)':t.k<20?' (túladott)':''}, ${t.k>t.d?'K fent':'K lent'}`;
const vol=t.vr>1.5?'magas':t.vr<.6?'alacsony':'átlagos';
const fv=near(t.fvg,p).map(g=>`<span class="${g.t=='bull'?'up':'dn'}">${g.t=='bull'?'bullish':'bearish'}</span> ${fmt(g.lo)}–${fmt(g.hi)}`).join('<br>')||'nincs nyitott';
return`<div class="card"><div class="h"><b>${t.name}</b><b class="${c}">${l} (${t.s>0?'+':''}${t.s})</b></div>`+
row('RSI',t.rsi.toFixed(0))+row('Stoch RSI',sk)+
row('MACD',`hisztogram ${t.h>0?'pozitív':'negatív'}, ${t.h>t.hp?'nő':'csökken'}`)+
row('Volumen',`${t.vr.toFixed(1)}× átlag (${vol})`)+
row('EMA 20/50/200',`ár ${ab(t.e20)} / ${ab(t.e50)} / ${ab(t.e200)}`)+
row('Szerkezet',t.st.H?`<span class="${t.st.t=='emelkedő'?'up':t.st.t=='csökkenő'?'dn':'nu'}">${t.st.H} + ${t.st.L}</span> (${t.st.t})`:t.st.t)+
row('Divergencia',t.div.length?t.div.map(d=>`<span class="${d.t=='bullish'?'up':'dn'}">${d.t}</span> (${d.ok?'megerősített':'megerősítetlen'})`).join('<br>'):'nincs')+
row('FVG',fv)+`</div>`}
function conf(){const T=S.tf,a=T[2].s+T[3].s,b=T[0].s+T[1].s;return Math.abs(a)>=2&&Math.abs(b)>=2&&a*b<0?'⚠ Ellentmondás: a magasabb idősík (4ó+1n) '+(a>0?'emelkedő':'csökkenő')+', az alacsonyabb (15p+1ó) '+(b>0?'emelkedő':'csökkenő')+' jelzést ad.':''}
function plan(){const T=S.tf,p=S.price,Z=S.zones,A=T[1].atr,h=T[2].s+T[3].s,no=r=>({d:'NO TRADE',r});
const dir=h>=3?1:h<=-3?-1:0;
if(!dir)return no('A 4ó és az 1n trendje nem elég egyértelmű (összesen '+(h>0?'+':'')+h+'/6, a belépőhöz legalább ±3 kell).');
if(T[2].st.t==(dir>0?'csökkenő':'emelkedő'))return no('A 4ó szerkezete ellentmond a magasabb idősík irányának.');
if(T[1].s*dir<1)return no('Az 1ó nem erősíti a 4ó/1n irányát, nincs belépési időtávú megerősítés.');
if(T[0].s*dir<=-3)return no('A 15p erősen ellentétes irányba mutat, várd meg a fordulót.');
const e=dir>0?Z.filter(z=>z.lo<p).sort((a,b)=>Math.min(p,b.hi)-Math.min(p,a.hi))[0]:Z.filter(z=>z.hi>p).sort((a,b)=>Math.max(p,a.lo)-Math.max(p,b.lo))[0],nm=dir>0?'támasz':'ellenállás';
if(!e)return no('Nincs közeli '+nm+' zóna a belépéshez.');
const entry=dir>0?Math.min(p,e.hi):Math.max(p,e.lo),dist=Math.abs(p-entry);
if(dist>2*A)return no('A '+nm+' zóna ('+fmt(e.lo)+'–'+fmt(e.hi)+') túl messze van ('+(dist/A).toFixed(1)+'× ATR), várj visszahúzódásra.');
const stop=dir>0?Math.min(e.lo-.5*A,entry-A):Math.max(e.hi+.5*A,entry+A),risk=Math.abs(entry-stop);
const O=(dir>0?Z.filter(z=>z.lo>entry).sort((a,b)=>a.lo-b.lo):Z.filter(z=>z.hi<entry).sort((a,b)=>b.hi-a.hi)).map(z=>dir>0?z.lo:z.hi);
const tp1=O[0]??entry+dir*1.5*risk,tp2=O[1]??tp1+dir*1.5*risk,rr1=Math.abs(tp1-entry)/risk,rr2=Math.abs(tp2-entry)/risk;
if(rr1<1.5)return no('A következő '+(dir>0?'ellenállás':'támasz')+' ('+fmt(tp1)+') túl közel van, a kockázat:hozam csak '+rr1.toFixed(1)+', legalább 1,5 kell.');
return{d:dir>0?'LONG':'SHORT',entry,stop,tp1,tp2,rr1,rr2,mod:dist<.25*A?'piaci ár':'visszateszt',r:'A 4ó és az 1n '+(dir>0?'emelkedő':'csökkenő')+', az 1ó erősít. Belépő a '+nm+' zónánál ('+fmt(e.lo)+'–'+fmt(e.hi)+'), a stop a zóna túloldalán (legalább 1 ATR), a célok a következő zónáknál.'}}
function render(){const p=S.price;$('#px').textContent='$'+fmt(p);
const tw=S.tf.reduce((a,t)=>a+t.w,0),o=S.tf.reduce((a,t)=>a+t.w*t.s/3,0)/tw*100;S.o=o;
const[lb,cl]=lab(o);$('#ob').textContent='Összkép: '+lb+' ('+(o>0?'+':'')+Math.round(o)+')';$('#ob').className='ob '+cl;$('#mk').style.left=(o+100)/2+'%';
const g=S.sig,cf=conf();$('#sg').innerHTML=`<div class="card"><div class="h"><b>Jelzés</b><b class="${g.d=='LONG'?'up':g.d=='SHORT'?'dn':'nu'}">${g.d}</b></div>`+(g.entry?row('Belépő',fmt(g.entry)+' ('+g.mod+')')+row('Stop',fmt(g.stop))+row('TP1',fmt(g.tp1)+' (R:R '+g.rr1.toFixed(1)+')')+row('TP2',fmt(g.tp2)+' (R:R '+g.rr2.toFixed(1)+')'):'')+`<div class="m" style="margin-top:6px">${g.r}</div>${cf?`<div class="nu" style="margin-top:6px">${cf}</div>`:''}</div>`;
$('#tf').innerHTML=S.tf.map(card).join('');chart();
const Z=S.zones,u=Z.filter(z=>z.mid>p).sort((a,b)=>a.mid-b.mid).slice(0,3).reverse(),d=Z.filter(z=>z.mid<=p).sort((a,b)=>b.mid-a.mid).slice(0,3);
const st=s=>s>=6?'erős':s>=3?'közepes':'gyenge';
const zr=(z,c)=>{const lo=z.lo==z.hi?z.lo*.999:z.lo,hi=z.lo==z.hi?z.hi*1.001:z.hi;return`<div class="r ${c}"><span>${fmt(lo)}–${fmt(hi)}</span><b>${st(z.s)}, ${((z.mid-p)/p*100).toFixed(1)}%</b></div>`};
$('#zn').innerHTML='<div class="card"><div class="sub">Ellenállás</div>'+(u.map(z=>zr(z,'dn')).join('')||'<div class="m">nincs a közelben</div>')+'<div class="now">Ár: $'+fmt(p)+'</div><div class="sub">Támasz</div>'+(d.map(z=>zr(z,'up')).join('')||'<div class="m">nincs a közelben</div>')+'</div>'}
function chart(){const i=S.ci??1,t=S.tf[i],p=S.price;
$('#ch').innerHTML=S.tf.map((v,j)=>`<button class="chip${j==i?' on':''}" data-i="${j}">${v.name}</button>`).join('');
const cv=$('#cv'),W=cv.clientWidth,H=260,R=devicePixelRatio||1,pr=46;cv.width=W*R;cv.height=H*R;
const x=cv.getContext('2d');x.scale(R,R);
const cd=t.cd.slice(-70),n=cd.length,w=(W-pr)/n,c=t.cd.map(q=>q.c),e1=ema(c,20).slice(-n),e2=ema(c,50).slice(-n);
let hi=Math.max(...cd.map(q=>q.h),p),lo=Math.min(...cd.map(q=>q.l),p);const pd=(hi-lo)*.04;hi+=pd;lo-=pd;
const y=v=>H-8-(v-lo)/(hi-lo)*(H-16);
x.save();x.beginPath();x.rect(0,0,W-pr,H);x.clip();
S.zones.forEach(z=>{if(z.hi<lo||z.lo>hi)return;const a=y(z.hi),b=y(z.lo);x.fillStyle=z.mid>p?'rgba(229,100,95,.18)':'rgba(63,182,139,.18)';x.fillRect(0,a,W-pr,Math.max(b-a,3))});
x.setLineDash([4,3]);x.strokeStyle='#f2a93b';near(t.fvg,p).forEach(g=>{if(g.hi<lo||g.lo>hi)return;x.strokeRect(.5,y(g.hi),W-pr-1,Math.max(y(g.lo)-y(g.hi),2))});x.setLineDash([]);
cd.forEach((q,k)=>{const cx=k*w+w/2;x.strokeStyle=x.fillStyle=q.c>=q.o?'#3fb68b':'#e5645f';x.beginPath();x.moveTo(cx,y(q.h));x.lineTo(cx,y(q.l));x.stroke();const a=y(Math.max(q.o,q.c)),b=y(Math.min(q.o,q.c));x.fillRect(cx-w*.35,a,w*.7,Math.max(b-a,1))});
[[e1,'#f2a93b'],[e2,'#7aa2f7']].forEach(([e,col])=>{x.strokeStyle=col;x.lineWidth=1.5;x.beginPath();e.forEach((v,k)=>k?x.lineTo(k*w+w/2,y(v)):x.moveTo(w/2,y(v)));x.stroke()});
x.restore();
x.setLineDash([2,3]);x.strokeStyle='#e8edf5';x.beginPath();x.moveTo(0,y(p));x.lineTo(W-pr,y(p));x.stroke();x.setLineDash([]);
x.fillStyle='#8a98b0';x.font='11px -apple-system,sans-serif';[hi,(hi+lo)/2,lo].forEach(v=>x.fillText(fmt(v),W-pr+4,y(v)+4));
x.fillStyle='#e8edf5';x.fillText(fmt(p),W-pr+4,y(p)+4)}
async function load(){try{$('#st').textContent='Frissítés…';
const[raws,px]=await Promise.all([Promise.all(TF.map(t=>get(t[0]))),tick().catch(()=>null)]);S.price=px||raws[0].at(-1).c;
S.tf=TF.map((t,i)=>({name:t[1],w:t[2],zw:t[3],...analyze(raws[i])}));S.zones=zones(S.tf,S.price);S.sig=plan();render();
$('#st').textContent='Frissítve: '+new Date().toLocaleTimeString('hu-HU')}
catch(e){$('#st').textContent='Hiba: '+e.message+'. Ellenőrizd a netkapcsolatot, majd húzd le a frissítéshez.'}}
